name: update-limits

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓取申购状态与公告
        run: node build.mjs
      - name: 每日心跳提交（避免 60 天无活动导致定时任务被停用）
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f public/limits.json public/limits-snap.js
            if ! git diff --cached --quiet; then
              git commit -m "每日数据快照 $(date -u +%F)"
              git push
            fi
          else
            echo "非 00 时，跳过心跳提交"
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
